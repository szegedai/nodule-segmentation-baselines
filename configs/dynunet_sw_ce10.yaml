# Stage 2 Fine — DynUNet, SLIDING-WINDOW variant.
#
# Same architecture as `dynunet.yaml`; differs only in inference recipe
# (SW at 128³ instead of 256³ resample). See reports/nodule_dynunet_sw.md
# for test-set comparison.

task: nodule

data:
  root:         ${DATA_ROOT}              # released dataset: split.csv, ct_3d/, nodule_sem_seg_3d/
  val_fraction: 0.15                      # patient-level val set carved from split.csv train
  split_seed:   42
  bbox_csv:     outputs/bboxes_gt.csv     # scripts/make_bboxes.py --source gt
  num_workers:  8

preprocessing:
  patch_size:   [128, 128, 128]
  bbox_padding: 20

model:
  name:         dynunet
  spatial_dims: 3
  in_channels:  1
  out_channels: 2
  # DynUNet at 128³ input: 4 stride-2 downsamples yield an 8³ bottleneck.
  strides:      [[1, 1, 1], [2, 2, 2], [2, 2, 2], [2, 2, 2], [2, 2, 2]]
  kernel_size:  [[3, 3, 3], [3, 3, 3], [3, 3, 3], [3, 3, 3], [3, 3, 3]]
  upsample_kernel_size: [[2, 2, 2], [2, 2, 2], [2, 2, 2], [2, 2, 2]]
  norm_name:    instance
  deep_supervision: false
  dropout_prob: 0.0

training:
  mode:               sliding_window
  patches_per_volume: 4
  pos_neg_ratio:      2
  epochs:             400
  batch_size:         2
  lr:                 1.0e-5
  weight_decay:       1.0e-5
  val_interval:       5
  device:             cuda
  amp:                true
  amp_dtype:          bfloat16
  seed:               42

loss:
  alpha:      0.3
  beta:       0.7
  gamma:      2.0
  prob_clamp: 1.0e-4
  lambda_ce:        0.1
  ce_bg_weight:     1.0
  ce_nodule_weight: 10.0

scheduler:
  T_max:   400
  eta_min: 1.0e-6

inference:
  sw_overlap: 0.5
  sw_batch:   4

checkpoints:
  dir:        checkpoints/dynunet_sw_ce10
  save_every: 50

logging:
  dir:          runs/dynunet_sw_ce10
